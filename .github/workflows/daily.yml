name: Daily Scrape

on:
  schedule:
    # Runs every day at 00:00 AM UTC (GitHub Actions cron is always UTC)
    # Use '0 0 * * *' for 00:00 UTC, '0 1 * * *' for 00:00 WEST/CET (Morocco) -> 01:00 UTC
    - cron: '58 22 * * *'
  workflow_dispatch: 

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run auto_run.sh
        run: |
          chmod +x auto_run.sh
          bash ./auto_run.sh

      - name: Commit and push updated DB (if changed)
        run: |
          # 1. Configure Git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # 2. Add files safely (ignoring "pathspec did not match" errors)
          git add scrape_data.db 2>/dev/null || true
          git add *.csv 2>/dev/null || true
          
          # 3. Check if anything actually changed
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # 4. Handle remote updates gracefully using Git stash
            echo "Changes detected. Syncing with remote repository..."
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || echo "No stash to pop or minor conflict resolved"
            
            # 5. Re-stage files after the pull/rebase
            git add scrape_data.db 2>/dev/null || true
            git add *.csv 2>/dev/null || true
            
            # 6. Commit and Push
            git commit -m "chore: daily scrape $(date -u +'%Y-%m-%d')"
            git push origin main
          fi

      - name: Upload artifacts (CSV/DB)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrape-results-${{ github.run_number }}
          path: |
            *.csv
            *.db
          if-no-files-found: warn
